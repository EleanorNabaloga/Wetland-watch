name: Inactive Issue and Pull Request Triage

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  triage:
    name: Mark Inactive Issues and PRs
    runs-on: ubuntu-latest
    steps:
      - name: Process Inactive Items
        uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 7
          stale-issue-message: "This issue has been automatically marked as stale due to 60 days of inactivity. It will be closed in 7 days if no further activity occurs."
          stale-pr-message: "This pull request has been automatically marked as stale due to 60 days of inactivity. It will be closed in 7 days if no further activity occurs."
          stale-issue-label: "status: stale"
          stale-pr-label: "status: stale"
          exempt-issue-labels: "pinned,security,statutory-hold"
          exempt-pr-labels: "security,statutory-hold"
